# 西邮点评家 - 反向代理 & 安全加固 Nginx 模板
# 适用：腾讯云 CDN(高防) -> Nginx -> Spring Boot(127.0.0.1:8080)
# 说明：${DOMAIN} 替换为实际备案域名；证书路径按实际情况修改。

# ---------- 全局 ----------
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;   # 单 worker 最大连接数（防连接数打满）
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ---------- 限速（CC / 刷量防护） ----------
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;      # 单 IP 每秒 10 请求
    limit_req_zone $binary_remote_addr zone=review_per_ip:10m rate=1r/s;    # 单 IP 写接口更严格（评论）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn conn_per_ip 20;                                              # 单 IP 并发连接上限

    # 定义 CDN 白名单来源（高防/CDN 回源请求才放行，防止绕过 CDN 直接打源站）
    geo $allow_from {
        default 0;
        # 在这里填入腾讯云 CDN 回源 IP 段（从控制台获取），示例：
        # 203.0.113.0/24 1;
    }

    # 上游：本机 Spring Boot
    upstream xiyou_backend {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name ${DOMAIN};
        # 全站跳转 HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN};

        # ---------- TLS 加固 ----------
        ssl_certificate     /etc/nginx/certs/${DOMAIN}.crt;
        ssl_certificate_key /etc/nginx/certs/${DOMAIN}.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------- 安全响应头（XSS / 点击劫持 / MIME 嗅探） ----------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://${DOMAIN}; img-src 'self' data: https://thirdwx.qlogo.cn; style-src 'self' 'unsafe-inline'" always;

        # ---------- 静态资源缓存 ----------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
        }

        # ---------- API 反代（限流 + 源站来源校验） ----------
        location /api/ {
            # 绕过 CDN 直连源站的请求直接拒绝（配合 geo）
            if ($allow_from = 0) {
                return 403;
            }

            # 写接口限流：评论/举报等（更严），读接口走 api_per_ip
            location ~ ^/api/v1/reviews$ {
                limit_req zone=review_per_ip burst=5 nodelay;
                proxy_pass http://xiyou_backend;
                include /etc/nginx/proxy_params;
            }

            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://xiyou_backend;
            include /etc/nginx/proxy_params;
        }

        # ---------- 请求体上限（评论正文 <= 200 字，防超大 POST 打爆内存） ----------
        client_max_body_size 32k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 10s;

        # 默认 404
        location / {
            return 404;
        }
    }
}

# ---------- proxy_params ----------
# 建议另存为 /etc/nginx/proxy_params 并在 include 处引用：
