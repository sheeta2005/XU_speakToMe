# 10/20：本地快速体验，端口只绑定回环地址；生产部署另行配置 HTTPS、备份与监控。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: speak_to_me
      MYSQL_USER: speak_to_me
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 scripts/init-env.ps1 或 scripts/init-env.sh}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先初始化 .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT COUNT(*) FROM campus' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先初始化 .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-demo}
      SERVER_ADDRESS: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: speak_to_me
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先初始化 .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先初始化 .env}
      AES_KEY: ${AES_KEY:?请先初始化 .env 中的 AES_KEY}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/v1/campuses | grep -q '\"code\":0'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
volumes:
  mysql-data:
  redis-data:
